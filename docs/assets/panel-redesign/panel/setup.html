<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create administrator · SelfPost</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../shared/brand.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="columns is-gapless sp-signin">
  <div class="column is-half sp-signin-brand">
    <div>
      <img src="../../selfpost-stamp.svg" alt="SelfPost">
      <p>YOUR SMTP. YOUR RULES.</p>
    </div>
  </div>
  <div class="column is-half sp-signin-form">
    <form class="sp-form" method="post" action="overview.html">
      <p class="sp-kicker">First run · one-time link</p>
      <h1 class="title is-3">Create administrator</h1>
      <p class="sp-muted mb-4">This link creates the single global administrator. After you submit, it stops working for good.</p>
      <div class="field">
        <label class="label" for="username">Username</label>
        <div class="control has-icons-left"><input class="input" id="username" name="username" autocomplete="username" required><span class="icon is-left"><i class="ti ti-user"></i></span></div>
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <div class="control has-icons-left"><input class="input" id="password" name="password" type="password" autocomplete="new-password" required><span class="icon is-left"><i class="ti ti-lock"></i></span></div>
      </div>
      <div class="field">
        <label class="label" for="password_confirm">Confirm password</label>
        <div class="control has-icons-left"><input class="input" id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required><span class="icon is-left"><i class="ti ti-lock"></i></span></div>
      </div>
      <div class="field mt-5"><button type="submit" class="button is-primary is-fullwidth">Create administrator</button></div>
    </form>
    <p class="sp-foot">© 2026 Mix · <a href="#">License (AGPL-3.0)</a> · <a href="#">Source</a> · No warranty</p>
  </div>
</div>

</body>
</html>
