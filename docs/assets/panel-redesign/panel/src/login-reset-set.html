<!-- title: New password | shell: bare -->
<div class="columns is-gapless sp-signin">
  <div class="column is-half sp-signin-brand">
    <div>
      <img src="../../selfpost-stamp.svg" alt="SelfPost">
      <p>YOUR SMTP. YOUR RULES.</p>
    </div>
  </div>
  <div class="column is-half sp-signin-form">
    <form class="sp-form" method="post" action="login.html">
      <p class="sp-kicker">mail.example.org · admin</p>
      <h1 class="title is-3">New password</h1>
      <p class="sp-muted mb-4">Setting it signs every session of this account out; sign in with it afterwards.</p>
      <div class="field">
        <label class="label" for="new_password">New password</label>
        <div class="control has-icons-left"><input class="input" id="new_password" name="new_password" type="password" autocomplete="new-password" required><span class="icon is-left"><i class="ti ti-lock"></i></span></div>
      </div>
      <div class="field">
        <label class="label" for="new_password_confirm">Repeat</label>
        <div class="control has-icons-left"><input class="input" id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" required><span class="icon is-left"><i class="ti ti-lock"></i></span></div>
      </div>
      <div class="field mt-5"><button type="submit" class="button is-primary is-fullwidth">Set password</button></div>
    </form>
    <p class="sp-foot">Copyright © 2026 Mikhail Yenuchenko · <a href="#">License (AGPL-3.0)</a> · <a href="#">Source</a> · No warranty</p>
  </div>
</div>
