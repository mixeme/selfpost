<!-- title: Confirm e-mail | shell: bare -->
<div class="columns is-gapless sp-signin">
  <div class="column is-half sp-signin-brand">
    <div>
      <img src="../../selfpost-stamp.svg" alt="SelfPost">
      <p>YOUR SMTP. YOUR RULES.</p>
    </div>
  </div>
  <div class="column is-half sp-signin-form">
    <form class="sp-form" method="post" action="account.html">
      <p class="sp-kicker">mail.example.org · admin</p>
      <h1 class="title is-3">Confirm e-mail</h1>
      <p class="sp-muted mb-4"><span class="sp-mono">mix@example.org</span> becomes the confirmed address of this account: where a link to reset its password can be sent.</p>
      <div class="field mt-5"><button type="submit" class="button is-primary is-fullwidth">Confirm</button></div>
    </form>
    <p class="sp-foot">Copyright © 2026 Mikhail Yenuchenko · <a href="#">License (AGPL-3.0)</a> · <a href="#">Source</a> · No warranty</p>
  </div>
</div>
