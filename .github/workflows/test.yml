name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # design-first.sh reads each commit's parent and the template history.
          fetch-depth: 0

      - name: Design first
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/design-first.sh "$BASE" "$HEAD"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Format
        run: |
          fmt="$(gofmt -l .)"
          if [ -n "$fmt" ]; then
            echo "$fmt"
            echo "gofmt needed on the files above; run 'gofmt -w .'"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
