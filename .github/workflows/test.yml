name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # design-first.sh reads each commit's parent and the template history.
          fetch-depth: 0

      - name: Design first
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/design-first.sh "$BASE" "$HEAD"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum

      - name: Format
        run: |
          fmt="$(gofmt -l .)"
          if [ -n "$fmt" ]; then
            echo "$fmt"
            echo "gofmt needed on the files above; run 'gofmt -w .'"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The e2e module runs only in release.yml, after a release is published;
      # a type error there would first show up then. Compile it here without
      # running it: `go test -run` would still run TestMain, which brings up
      # the whole stand.
      - name: Compile the e2e
        working-directory: test/e2e
        run: |
          go vet ./...
          go test -c -o /dev/null .
