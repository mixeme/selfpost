
# Alternative reverse-proxy: Caddy — the simplest option, fully automatic ACME
# with no separate certbot container. Caddy writes certificates as plain PEM
# under its own data directory, which this fragment bind-mounts to the host so
# SelfPost can read the same files.
#
# NOTE: Caddy's on-disk cert path includes
# the ACME CA's name as a path segment, e.g.
#   <data>/caddy/certificates/acme-v02.api.letsencrypt.org-directory/<hostname>/<hostname>.crt
# This has been stable across recent Caddy releases but is an internal
# storage detail, not a documented public API — VERIFY the exact path against
# the Caddy version you deploy (`docker compose exec caddy find /data/caddy/certificates -name '*.crt'`)
# before wiring it into the volume mount below. Measured with caddy:2.11.7 on
# a fresh host, 2026-10-25: exactly this path, the certificate 9 s after
# Caddy's first start.
# Read in the source (caddyserver/certmagic, storage.go, KeyBuilder.SiteCert():
# certificates/<issuer key>/<domain>/<domain>.crt; acmeissuer.go, issuerKey():
# the CA URL's host and path, "acme-v02.api.letsencrypt.org-directory" for Let's
# Encrypt). caddy/modules/caddytls/automation.go, DefaultIssuers(): ZeroSSL is a
# second issuer only when an email is configured, and the Caddyfile below sets
# none. Read at the projects' master of 2026-10-14, when the image was the
# moving `caddy:2`; it is pinned below now, and a bump re-reads these.
#
# Merge with the base file — run this from the project directory, the one
# holding docker-compose.yml, with this file in its caddy/ (Compose resolves
# every relative path in both files against the directory of the FIRST -f
# file, which is why paths below are ./caddy/... -
# docs.docker.com/compose/how-tos/multiple-compose-files/merge/: "Paths are
# evaluated relative to the base file"):
#
#   docker compose -f docker-compose.yml -f caddy/docker-compose.caddy.yml up -d

services:
  selfpost:
    ports: !override
      - "465:465"
      - "587:587"
      - "25:25"
    environment:
      # Caddy names certificate files after the hostname, not
      # fullchain.pem/privkey.pem like certbot, in a folder of the same name -
      # override the base file's paths to match.
      TLS_CERT_FILE: /etc/postfix/tls/<hostname>/<hostname>.crt
      TLS_KEY_FILE: /etc/postfix/tls/<hostname>/<hostname>.key
    volumes: !override
      - ./data:/data
      - .:/selfpost-deploy:ro
      # The issuer's folder, not the hostname's below it: on its first start
      # Caddy deletes the hostname's folder while it is empty and makes a new
      # one when the certificate comes (certmagic v0.25.6, the version Caddy
      # 2.11.7 builds with, maintain.go, deleteExpiredCerts(): "deleting site
      # folder because key is empty"; it never deletes the issuer's). Docker
      # creates a missing mount source as an empty folder, so a mount of the
      # hostname's folder kept pointing at the deleted one, and Postfix had
      # no certificate until the container was recreated (measured on a fresh
      # host, 2026-10-25: two folders, two inodes).
      - ./caddy/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory:/etc/postfix/tls:ro

  caddy:
    # Pinned to a release: "2" moves under a running server (security audit
    # 2026-10-17, I4). Bump it deliberately.
    image: caddy:2.11.7
    restart: unless-stopped
    # A ceiling on processes and threads (security audit 2026-10-17, I3).
    pids_limit: 256
    depends_on:
      - selfpost
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/caddy-data:/data
      - ./caddy/caddy-config:/config
